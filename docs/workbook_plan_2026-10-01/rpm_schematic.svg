  <path d="M214 129 H270 V138" class="ln"/>
  <path d="M214 199 H250 V150 H270" class="ln"/>
  <path d="M214 212 H250 V228 H270" class="ln"/>
  <path d="M214 269 H270 V318" class="ln"/>
  <path d="M214 339 H240 V236 H270" class="lnp"/>
  <path d="M214 349 H245 V408 H270" class="lnp"/>
  <path d="M214 359 H250 V498 H270" class="lnp"/>
  <path d="M214 409 H258 V514 H270" class="ln"/>
  <path d="M214 419 H262 V580 H270" class="ln"/>
  <path d="M214 479 H270 V498" class="ln"/>

  <!-- engines -> engines -->
  <path d="M420 176 V190" class="ln"/>
  <path d="M570 335 H600 V498 H570" class="ln"/><text x="582" y="420" class="lab" transform="rotate(90 582 420)">seller rate</text>

  <!-- engines -> scenarios -->
  <path d="M570 240 H630 V150" class="ln"/>
  <path d="M570 320 H610 V165 H630" class="ln"/>
  <path d="M570 410 H615 V178 H630" class="lnp"/>
  <path d="M570 505 H620 V198 H630" class="ln"/>
