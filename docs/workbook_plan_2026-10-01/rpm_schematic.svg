  <!-- scenarios -> rpm -->
  <path d="M930 180 H990" class="ln"/><text x="936" y="172" class="lab">selected case</text>
  <path d="M930 395 H990" class="ln"/>
  <path d="M1075 336 V360" class="ln"/>

  <!-- legend / footer -->
  <text x="24" y="560" class="h">Reading the chain for one quarter (FQ1 FY27, case 4 "Both")</text>
  <text x="24" y="582" class="t">1. E1 gives the fleet by age and body for CY2026–27; E2 weights it into the quarter, applies the 2025 CCC total-loss rates → pool ratio 0.992 vs FQ1 FY26.</text>
  <text x="24" y="600" class="t">2. E3 gives Copart's share ratio 0.938 (Progressive at 5% vs 25% a year earlier; State Farm and "other" events on). E4 gives Δunits −0.5% and Δprice −0.4% at the first ramp step.</text>
  <text x="24" y="618" class="t">3. Scenarios: units = FQ1 FY26 units (849k, from the E5 ledger) × 0.992 × 0.938 × 0.995; ASP = $3,041 × 1.037 × 0.996; RPU from the fee parameters with the concession seller rate.</text>
  <text x="24" y="636" class="t">4. Revenue = units × RPU + E6 branches → legacy service for the quarter; four quarters sum to FY27E $3,880.5m (case 4), shown on the RPM beside JPM's $4,061m.</text>
  <text x="24" y="664" class="s">Labels on every input: VERIFIED · MEASURED · FITTED · CALIBRATED · ASSUMED · UNVERIFIED · ENGINE. Twenty-one inputs have no source today (docs/source_trace_2026-10-01); they appear only as labelled sensitivities, never inside case 1.</text>
  <text x="24" y="700" class="s">File: docs/workbook_plan_2026-10-01/rpm_schematic.svg · 1 October 2026</text>
</svg>
